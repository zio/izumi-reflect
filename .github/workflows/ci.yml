# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags -Xmx4000M -XX:ReservedCodeCacheSize=384M -XX:NonProfiledCodeHeapSize=256M -XX:MaxMetaspaceSize=1024M
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - develop
  pull_request:
    branches-ignore:
    - gh-pages
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Setup Coursier
      uses: coursier/setup-action@v1
    - name: Check sbtgen output is up to date
      run: bash sbtgen.sc --js --native && git diff --exit-code
    - name: Check GitHub workflows are up to date
      run: sbt -batch ciCheckGithubWorkflow
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '17'
        - '21'
        scala:
        - '2.12'
        - '2.13'
        - '3'
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: ${{ matrix.java }}
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Install clang (Scala Native)
      run: sudo apt-get update && sudo apt-get install -y clang libunwind-dev
    - name: Test
      run: sbt -batch "++ ${{ matrix.scala }} clean" "++ ${{ matrix.scala }} Test/compile" "++ ${{ matrix.scala }} test" "++ ${{ matrix.scala }} mimaReportBinaryIssues"
  ci:
    name: ci
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - lint
    - test
    if: always()
    steps:
    - name: Report Failed CI
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: 'echo "ci failed: one or more required jobs did not succeed"; exit 1'
    - name: Report Successful CI
      run: echo "ci passed"
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false
    needs:
    - ci
    if: ${{ ((github.event_name == 'release') || (github.event_name == 'workflow_dispatch')) || (github.ref == 'refs/heads/develop') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Install clang (Scala Native)
      run: sudo apt-get update && sudo apt-get install -y clang libunwind-dev
    - name: Publish to Sonatype
      run: |
        if [ -z "$OPENSSL_KEY" ] || [ -z "$OPENSSL_IV" ] || [ -z "$SONATYPE_USERNAME" ] || [ -z "$SONATYPE_PASSWORD" ]; then
          echo "Secrets are not available, skipping publish"
          exit 0
        fi
        if [[ "$GITHUB_REF" != refs/tags/v* && "$GITHUB_REF" != refs/heads/develop ]]; then
          echo "Publishing not allowed for $GITHUB_REF"
          exit 0
        fi
        openssl aes-256-cbc -K "${OPENSSL_KEY}" -iv "${OPENSSL_IV}" -in secrets.tar.enc -out secrets.tar -d
        tar xvf secrets.tar
        ln -s .secrets/local.sbt local.sbt
        rm ./.secrets/credentials.sonatype-nexus.properties
        printf "%s\n" "realm=Sonatype Nexus Repository Manager" "host=central.sonatype.com" "user=${SONATYPE_USERNAME}" "password=${SONATYPE_PASSWORD}" > ./.secrets/credentials.sonatype-nexus.properties
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          sbt -batch "show credentials" "+clean" "+Test/compile" "+publishSigned" "sonaRelease"
        else
          sbt -batch "show credentials" "+clean" "+Test/compile" "+publishSigned"
        fi
      env:
        OPENSSL_IV: ${{ secrets.OPENSSL_IV }}
        OPENSSL_KEY: ${{ secrets.OPENSSL_KEY }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
  release-docs:
    name: Release Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    permissions:
      contents: read
      id-token: write
    needs:
    - release
    if: ${{ (github.event_name == 'release') || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Setup NodeJs
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.12.0
        registry-url: https://registry.npmjs.org
    - name: Publish Docs to NPM Registry
      run: |
        cp .mdl/resources/zio-docs.sbt zio-docs.sbt
        awk '/<!--- docs:start --->/,/<!--- docs:end --->/' README.md >> docs/index.md
        sed -i '/<!--- docs:start --->/d' docs/index.md
        sed -i '/<!--- docs:end --->/d' docs/index.md
        sbt -batch docs/publishToNpm
  notify-docs-release:
    name: Notify Docs Release
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - release-docs
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Check App Token
      id: check-app-token
      run: |
        if [ -n "$APP_ID" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        APP_ID: ${{ secrets.APP_ID }}
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      if: ${{ steps.check-app-token.outputs.configured == 'true' }}
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: notify the main repo about the new release of docs package
      run: |
        PACKAGE_NAME=$(cat docs/package.json | grep '"name"' | awk -F'"' '{print $4}')
        PACKAGE_VERSION=$(npm view $PACKAGE_NAME version)
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token $NOTIFY_TOKEN"\
            https://api.github.com/repos/zio/zio/dispatches \
            -d '{
                  "event_type":"update-docs",
                  "client_payload":{
                    "package_name":"'"${PACKAGE_NAME}"'",
                    "package_version": "'"${PACKAGE_VERSION}"'"
                  }
                }'
      env:
        NOTIFY_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PAT_TOKEN }}
